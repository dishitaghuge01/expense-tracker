name: Android prototype
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  prototype:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install specified Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Check prototype boundary
        run: python3 ../ops/release/check-prototype-boundary.py
      - name: Test, lint and build
        run: ./gradlew --no-daemon :core-model:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease
      - name: Upload development APK
        uses: actions/upload-artifact@v4
        with:
          name: disposable-prototype-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
