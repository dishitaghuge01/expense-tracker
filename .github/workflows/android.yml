name: Android prototype
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  prototype:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install specified Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Cache checksum-pinned Gradle distribution
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-wrapper-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Bootstrap Gradle with bounded download retries
        run: |
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon --version; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then sleep 10; fi
          done
          exit 1
      - name: Check prototype boundary and exported Room schema
        run: |
          python3 ../ops/release/check-prototype-boundary.py
          python3 ../ops/release/check-room-schema.py
      - name: Test, lint and build
        run: ./gradlew --no-daemon :core-model:test :core-data:testDebugUnitTest :core-data:assembleDebugAndroidTest :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease :app:bundleRelease
      - name: Verify generated Room schema is checked in
        run: git diff --exit-code -- core-data/schemas
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prototype-check-reports
          path: |
            android/**/build/reports/
            android/**/build/test-results/
          retention-days: 7
      - name: Upload development APK
        uses: actions/upload-artifact@v4
        with:
          name: disposable-prototype-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
