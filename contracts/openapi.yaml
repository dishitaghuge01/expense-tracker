openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Expense Tracker local release metadata
  version: 0.0.3-prototype
  description: >-
    Partial, local-only Play-adjusted contract. No live deployment, listing,
    auth, device lease, household, capture, billing or price API is implemented.
    Null URLs mean deployment is blocked; sales remain closed. This replaces
    only the superseded APK-shaped public release metadata, not the full API.
servers:
  - url: /functions/v1/api/v1
security: []
paths:
  /release:
    get:
      operationId: getLocalRelease
      summary: Public local release metadata (no authentication)
      description: >-
        No query parameters are accepted, including unknown parameters. Only
        exact /v1/release and /api/v1/release handler paths are recognized.
        Other paths return 404. Other methods on a recognized path return 405.
        Metadata is immutable server configuration, never request input.
      responses:
        '200':
          description: Synthetic local release metadata, not deployment readiness
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum: ['public, max-age=300']
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, requestId]
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required:
                      - latestBuild
                      - minBuild
                      - versionName
                      - distribution
                      - playStoreUrl
                      - checkoutState
                      - supportUrl
                    properties:
                      latestBuild:
                        type: integer
                        minimum: 3
                        maximum: 3
                      minBuild:
                        type: integer
                        minimum: 3
                        maximum: 3
                      versionName:
                        type: string
                        enum: [0.0.3-prototype]
                      distribution:
                        type: string
                        enum: [google_play]
                      playStoreUrl:
                        description: Null locally; no approved production Play listing exists.
                        type: [string, 'null']
                        format: uri
                        pattern: '^https://'
                      checkoutState:
                        type: string
                        enum: [closed]
                      supportUrl:
                        description: Null locally; no approved production support origin exists.
                        type: [string, 'null']
                        format: uri
                        pattern: '^https://'
                  requestId:
                    type: string
                    format: uuid
        '400':
          description: Query parameters are not supported (INVALID_INPUT); no input echoed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Unrecognized handler path (NOT_FOUND); no input echoed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '405':
          description: Unsupported method on a recognized path (METHOD_NOT_ALLOWED)
          headers:
            Allow:
              required: true
              schema:
                type: string
                enum: [GET]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
components:
  schemas:
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error, requestId]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, retryable]
          properties:
            code:
              type: string
              enum: [INVALID_INPUT, NOT_FOUND, METHOD_NOT_ALLOWED]
            message:
              type: string
              minLength: 1
            field:
              type: string
              description: Optional static field name; never raw input.
            retryable:
              type: boolean
              enum: [false]
        requestId:
          type: string
          format: uuid
