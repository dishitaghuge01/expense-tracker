# LOCAL ONLY. No hosted project, production origin, OAuth provider or credentials.
# Start through ops/tooling/local-backend.sh for loopback-only Docker publishing.
project_id = "expense-tracker-local"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 100

[api.tls]
enabled = false

[db]
port = 54322
shadow_port = 54320
major_version = 17
health_timeout = "2m"

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[db.pooler]
enabled = false

[realtime]
enabled = false

[studio]
enabled = false

[local_smtp]
enabled = false

[storage]
enabled = false

[storage.s3_protocol]
enabled = false

[storage.analytics]
enabled = false

[storage.vector]
enabled = false

[auth]
enabled = false
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = []
enable_signup = false
enable_anonymous_sign_ins = false

[auth.email]
enabled = false

[auth.sms]
enabled = false

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083
deno_version = 2

[functions.api]
enabled = true
verify_jwt = false
entrypoint = "./functions/api/index.ts"

[analytics]
enabled = false

# Use only service versions bundled with the pinned CLI, never linked-project versions.
[local.services.default]
version = "bundled"
